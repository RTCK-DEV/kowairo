[project]
name = "kowairo"
version = "0.1.0"
description = "Realtime AI voice changer powered by AivisSpeech (Style-Bert-VITS2) voice models"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7.0",
    "sounddevice>=0.5.1",
    "numpy>=1.26,<3",
    "httpx>=0.27",
    "sherpa-onnx>=1.12.0",
    "py7zr>=0.22.0",
    "platformdirs>=4.2.0",
    "soundfile>=0.13.1",
    "soxr>=0.5.0",
]

[project.optional-dependencies]
# NVIDIA CUDA ASR backend (optional; TTS GPU is handled by the embedded engine via DirectML/CUDA)
whisper = [
    "faster-whisper>=1.1.0",
    # cuBLAS DLLs for ctranslate2 CUDA (inference needs cublas64_12 + cublasLt64_12;
    # cuDNN is statically linked into CT2 so nvidia-cudnn-cu12 is NOT needed)
    "nvidia-cublas-cu12; sys_platform=='win32' or sys_platform=='linux'",
]
gpu = [
    # optional CUDA array backend for GPU pitch/FFT paths
    # (cupy-cuda12x ships only the runtime shim; cuFFT comes from its own wheel)
    "cupy-cuda12x>=13.0; sys_platform=='win32' or sys_platform=='linux'",
    "nvidia-cufft-cu12; sys_platform=='win32' or sys_platform=='linux'",
]
dev = ["pytest>=8.0", "ruff>=0.6.0", "pyinstaller>=6.10"]

[project.scripts]
kowairo = "kowairo.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kowairo"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Japanese UI text & punctuation are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
